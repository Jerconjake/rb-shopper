<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Chat</title>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --brand:#2563eb;--brand-hover:#1d4ed8;--brand-10:rgba(37,99,235,.1);
  --accent:var(--brand);--accent-hover:var(--brand-hover);--accent-10:var(--brand-10);
  --text:#0f172a;--text-2:#64748b;--bg:#ffffff;--input-bg:#f8fafc;
  --border:#e2e8f0;--success:#10b981;--radius:12px;--transition:.2s ease;
}
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');
html,body{height:100%;overflow:hidden}
body{font-family:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
  color:var(--text);background:#fff;display:flex;flex-direction:column}

/* Header */
.chat-header{padding:16px 20px;background:var(--brand);color:#fff;display:flex;align-items:center;gap:12px;flex-shrink:0}
.chat-header .avatar{width:36px;height:36px;border-radius:50%;background:rgba(255,255,255,.2);
  display:flex;align-items:center;justify-content:center;flex-shrink:0}
.chat-header .avatar svg{width:20px;height:20px}
.chat-header .info h3{font-size:14px;font-weight:600;margin-bottom:1px}
.chat-header .info p{font-size:11px;opacity:.8}

/* Gate */
.gate{flex:1;display:flex;flex-direction:column;justify-content:center;padding:28px 24px;animation:fadeIn .35s ease}
.gate.hidden{display:none}
.gate h2{font-size:18px;font-weight:700;margin-bottom:4px}
.gate p{font-size:13px;color:var(--text-2);margin-bottom:20px;line-height:1.5}
.gate .field{margin-bottom:14px}
.gate .field label{display:block;font-size:12px;font-weight:600;color:var(--text);margin-bottom:5px}
.gate .field input{width:100%;padding:11px 14px;border:1.5px solid var(--border);border-radius:10px;
  font-size:14px;font-family:inherit;outline:none;background:var(--input-bg);transition:border-color var(--transition)}
.gate .field input:focus{border-color:var(--brand);box-shadow:0 0 0 3px var(--brand-10);background:#fff}
.gate .btn-start{width:100%;padding:13px;border:none;border-radius:10px;background:var(--accent);color:#fff;
  background:linear-gradient(135deg,var(--brand),var(--brand-hover));color:#fff;
  font-size:14px;font-weight:600;cursor:pointer;transition:all var(--transition);
  box-shadow:0 2px 8px rgba(37,99,235,.25);margin-top:4px}
.gate .btn-start:hover{transform:translateY(-1px);box-shadow:0 4px 16px rgba(37,99,235,.35)}
.gate .btn-start:disabled{opacity:.6;cursor:not-allowed;transform:none}
.gate .error{color:#ef4444;font-size:12px;margin-top:8px;display:none}
.gate .error.visible{display:block}

/* Chat */
.chat-body{flex:1;display:none;flex-direction:column;overflow:hidden}
.chat-body.active{display:flex}

.messages{flex:1;overflow-y:auto;padding:16px 20px;display:flex;flex-direction:column;gap:10px}
.msg{padding:10px 14px;border-radius:14px;font-size:13px;line-height:1.5;max-width:82%;
  animation:fadeSlideIn .3s ease;word-wrap:break-word;overflow-wrap:break-word}
.msg-user{background:linear-gradient(135deg,var(--accent),var(--accent-hover));color:#fff;
  align-self:flex-end;border-bottom-right-radius:4px;box-shadow:0 1px 4px rgba(37,99,235,.15)}
.msg-ai{background:var(--input-bg);color:var(--text);align-self:flex-start;
  border-bottom-left-radius:4px;border:1px solid var(--border)}

.typing{display:flex;gap:4px;padding:10px 14px;align-self:flex-start}
.typing span{width:7px;height:7px;background:#94a3b8;border-radius:50%;animation:bounce 1.4s infinite}
.typing span:nth-child(2){animation-delay:.2s}
.typing span:nth-child(3){animation-delay:.4s}
@keyframes bounce{0%,60%,100%{transform:translateY(0)}30%{transform:translateY(-5px)}}

/* CTA bar */
.cta-bar{display:none;padding:10px 20px;background:var(--accent-10);border-top:1px solid var(--border);
  text-align:center;animation:fadeSlideIn .35s ease;flex-shrink:0}
.cta-bar.visible{display:block}
.cta-bar a{font-size:13px;color:var(--accent);font-weight:600;text-decoration:none;
  display:inline-flex;align-items:center;gap:6px}
.cta-bar a:hover{text-decoration:underline}

/* Input */
.chat-input{padding:12px 20px;border-top:1px solid var(--border);display:flex;gap:8px;flex-shrink:0}
.chat-input input{flex:1;padding:11px 16px;border:1.5px solid var(--border);border-radius:22px;
  font-size:13px;font-family:inherit;outline:none;background:#fff;
  transition:border-color var(--transition)}
.chat-input input:focus{border-color:var(--brand);box-shadow:0 0 0 3px var(--brand-10)}
.chat-input button{width:40px;height:40px;border:none;border-radius:50%;
  background:linear-gradient(135deg,var(--accent),var(--accent-hover));color:#fff;
  cursor:pointer;display:flex;align-items:center;justify-content:center;
  transition:all var(--transition);flex-shrink:0}
.chat-input button:hover{transform:scale(1.08)}
.chat-input button svg{width:16px;height:16px}
.chat-input.disabled{pointer-events:none;opacity:.5}

/* Demo badge */
.demo-banner{display:none;padding:6px 20px;background:#fef3c7;color:#92400e;font-size:11px;
  font-weight:600;text-align:center;letter-spacing:.3px;text-transform:uppercase;flex-shrink:0}
body.demo-mode .demo-banner{display:block}

.demo-intent{display:inline-flex;align-items:center;gap:4px;padding:2px 8px;border-radius:4px;
  font-size:10px;font-weight:700;margin-left:8px;vertical-align:middle}
.demo-intent.buying{background:#fef3c7;color:#92400e}
.demo-intent.interested{background:#eff6ff;color:#1e40af}
.demo-intent.browsing{background:#f1f5f9;color:#64748b}
.demo-intent.handoff{background:#fef2f2;color:#991b1b}

@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@keyframes fadeSlideIn{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:translateY(0)}}
</style>
</head>
<body>

<div class="chat-header" id="header">
  <div class="avatar">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
      <path d="M21 15a2 2 0 01-2 2H7l-4 4V5a2 2 0 012-2h14a2 2 0 012 2z"/>
    </svg>
  </div>
  <div class="info">
    <h3 id="bizName">Chat with us</h3>
    <p>Typically replies instantly</p>
  </div>
</div>

<div class="demo-banner" id="demoBanner">⚡ Demo Mode — AI analysis shown inline</div>

<!-- NAME/EMAIL GATE -->
<div class="gate" id="gate">
  <h2>Hi there! 👋</h2>
  <p>Quick intro so we can follow up if needed, then let's chat.</p>
  <div class="field">
    <label for="gName">First name</label>
    <input type="text" id="gName" placeholder="Your first name" autocomplete="given-name">
  </div>
  <div class="field">
    <label for="gEmail">Email</label>
    <input type="email" id="gEmail" placeholder="your@email.com" autocomplete="email">
  </div>
  <button class="btn-start" id="startBtn">Start chatting</button>
  <div class="error" id="gateError"></div>
</div>

<!-- CHAT BODY -->
<div class="chat-body" id="chatBody">
  <div class="messages" id="messages"></div>
  <div class="cta-bar" id="ctaBar">
    <a id="ctaLink" href="#" target="_blank">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="16" height="16"><path d="M22 2L11 13M22 2l-7 20-4-9-9-4 20-7z"/></svg>
      <span id="ctaText">Get in touch →</span>
    </a>
  </div>
  <div class="chat-input" id="chatInput">
    <input type="text" id="chatField" placeholder="Type a message...">
    <button id="chatSend">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M22 2L11 13M22 2l-7 20-4-9-9-4 20-7z"/></svg>
    </button>
  </div>
</div>

<script>
(function(){
  var path = window.location.pathname;
  var match = path.match(/\/chat\/([^/?#]+)/);
  var clientId = match ? match[1] : '';
  if (!clientId) return;

  var BASE = window.location.origin;
  var config = {};
  var sessionId = null;
  var isDemo = false;
  var name = '';
  var email = '';

  var $ = function(id){ return document.getElementById(id); };

  function isValidEmail(e) { return /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(e); }

  function darken(hex, pct) {
    hex = hex.replace('#','');
    var r = parseInt(hex.substring(0,2),16);
    var g = parseInt(hex.substring(2,4),16);
    var b = parseInt(hex.substring(4,6),16);
    r = Math.max(0, Math.round(r * (1 - pct/100)));
    g = Math.max(0, Math.round(g * (1 - pct/100)));
    b = Math.max(0, Math.round(b * (1 - pct/100)));
    return '#' + r.toString(16).padStart(2,'0') + g.toString(16).padStart(2,'0') + b.toString(16).padStart(2,'0');
  }

  // Facebook Pixel
  function injectPixel(id) {
    if (window.fbq) return;
    !function(f,b,e,v,n,t,s){if(f.fbq)return;n=f.fbq=function(){n.callMethod?
    n.callMethod.apply(n,arguments):n.queue.push(arguments)};if(!f._fbq)f._fbq=n;
    n.push=n;n.loaded=!0;n.version='2.0';n.queue=[];t=b.createElement(e);t.async=!0;
    t.src=v;s=b.getElementsByTagName(e)[0];s.parentNode.insertBefore(t,s)}
    (window,document,'script','https://connect.facebook.net/en_US/fbevents.js');
    fbq('init', id); fbq('track', 'PageView');
  }

  function fireLeadEvent() {
    if (window.fbq) fbq('track', 'Lead');
  }

  // Init
  async function init() {
    try {
      var r = await fetch(BASE + '/config/' + clientId);
      config = await r.json();
      $('bizName').textContent = config.business_name || 'Chat with us';
      if (config.brand_color) {
        document.documentElement.style.setProperty('--brand', config.brand_color);
        document.documentElement.style.setProperty('--brand-hover', darken(config.brand_color, 15));
        document.documentElement.style.setProperty('--brand-10', config.brand_color + '1a');
        $('header').style.background = config.brand_color;
      }
      if (config.accent_color) {
        document.documentElement.style.setProperty('--accent', config.accent_color);
        document.documentElement.style.setProperty('--accent-hover', darken(config.accent_color, 15));
        document.documentElement.style.setProperty('--accent-10', config.accent_color + '1a');
      }
      if (config.demo_mode) {
        isDemo = true;
        document.body.classList.add('demo-mode');
      }
      if (config.widget_cta_text) {
        $('ctaText').textContent = config.widget_cta_text;
      }
      if (config.widget_cta_url) {
        $('ctaLink').href = config.widget_cta_url;
      }
      // Init pixel on standalone chat page (not in iframe/widget — widget.js handles its own)
      if (config.facebook_pixel_id && !isDemo && window === window.top) {
        injectPixel(config.facebook_pixel_id);
      }
    } catch(e) {}
  }
  init();

  // Start chat
  $('startBtn').addEventListener('click', async function() {
    name = $('gName').value.trim();
    email = $('gEmail').value.trim();
    if (!name) { showGateError('Please enter your name.'); return; }
    if (!email || !isValidEmail(email)) { showGateError('Please enter a valid email.'); return; }
    hideGateError();
    this.disabled = true;
    this.textContent = 'Connecting...';

    try {
      var r = await fetch(BASE + '/api/widget/start', {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({ client_id: clientId, name: name, email: email })
      });
      var data = await r.json();
      if (data.error) { showGateError(data.error); this.disabled = false; this.textContent = 'Start chatting'; return; }
      sessionId = data.session_id;
      $('gate').classList.add('hidden');
      $('chatBody').classList.add('active');
      addMessage(data.greeting, 'ai');
      $('chatField').focus();
    } catch(e) {
      showGateError('Connection error — please try again.');
      this.disabled = false;
      this.textContent = 'Start chatting';
    }
  });

  $('gName').addEventListener('keydown', function(e) { if (e.key === 'Enter') $('gEmail').focus(); });
  $('gEmail').addEventListener('keydown', function(e) { if (e.key === 'Enter') $('startBtn').click(); });

  function showGateError(msg) { $('gateError').textContent = msg; $('gateError').classList.add('visible'); }
  function hideGateError() { $('gateError').classList.remove('visible'); }

  // Send message
  async function sendMessage() {
    var input = $('chatField');
    var msg = input.value.trim();
    if (!msg || !sessionId) return;

    input.value = '';
    addMessage(msg, 'user');
    var typing = showTyping();
    $('chatInput').classList.add('disabled');

    try {
      var r = await fetch(BASE + '/api/widget/chat', {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({ client_id: clientId, session_id: sessionId, message: msg })
      });
      var data = await r.json();
      typing.remove();

      var aiMsg = addMessage(data.response, 'ai');

      if (data.show_cta && config.widget_cta_url) {
        $('ctaBar').classList.add('visible');
      }

      if (data.fire_conversion) {
        fireLeadEvent();
        try { window.parent.postMessage({type:'smartform_widget_lead'}, '*'); } catch(e){}
      }

      // Demo overlays
      if (isDemo && data.demo) {
        var intentCls = (data.demo.intent || '').toLowerCase();
        if (['buying','handoff'].indexOf(intentCls) >= 0) intentCls = 'buying';
        else if (intentCls === 'interested') intentCls = 'interested';
        else if (intentCls === 'browsing' || intentCls === 'other') intentCls = 'browsing';
        else intentCls = 'browsing';

        var badge = document.createElement('span');
        badge.className = 'demo-intent ' + intentCls;
        badge.textContent = (data.demo.intent || 'BROWSING') + (data.demo.should_notify ? ' 🔔' : '');
        aiMsg.appendChild(badge);
      }

      $('chatInput').classList.remove('disabled');
      $('chatField').focus();
    } catch(e) {
      typing.remove();
      addMessage("Something went wrong — please try again.", 'ai');
      $('chatInput').classList.remove('disabled');
    }
  }

  $('chatSend').addEventListener('click', sendMessage);
  $('chatField').addEventListener('keydown', function(e) {
    if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendMessage(); }
  });

  // Helpers
  function addMessage(text, type) {
    var div = document.createElement('div');
    div.className = 'msg msg-' + (type === 'user' ? 'user' : 'ai');
    div.textContent = text;
    $('messages').appendChild(div);
    $('messages').scrollTop = $('messages').scrollHeight;
    return div;
  }

  function showTyping() {
    var div = document.createElement('div');
    div.className = 'typing';
    div.innerHTML = '<span></span><span></span><span></span>';
    $('messages').appendChild(div);
    $('messages').scrollTop = $('messages').scrollHeight;
    return div;
  }

  // End session on unload
  window.addEventListener('beforeunload', function() {
    if (sessionId) {
      navigator.sendBeacon(BASE + '/api/widget/end', JSON.stringify({
        client_id: clientId, session_id: sessionId
      }));
    }
  });
})();
</script>
</body>
</html>
