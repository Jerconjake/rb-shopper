services:
  - type: web
    name: nurse-relief-form
    runtime: python
    rootDir: nurse-relief-form
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn server:app
    envVars:
      - key: OPENAI_API_KEY
        sync: false
      - key: SENDGRID_API_KEY
        sync: false
      - key: SENDGRID_FROM_EMAIL
        sync: false
      - key: OWNER_EMAIL
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: ADMIN_PIN
        sync: false
